# GHOSTWIRE.EXE — Label taxonomy (declarative source of truth)
#
# This file mirrors the labels that exist on GitHub. It is the canonical
# definition for review and for re-creating labels from scratch.
#
# Sync (idempotent — creates missing labels, updates nothing else):
#   bash scripts/sync-labels.sh
# or manually:
#   gh label create "<name>" --color "<hex>" --description "<text>"
#
# Color convention:
#   red/dark-red  bug, security, audit, priority: critical/high, regression, microphone
#   orange        performance, priority: high, size: L
#   yellow        refactor, chore, priority: medium, browser-compat, area: sessions, size: M
#   green         research, area: dsp, dsp: fft, priority: low, size: S, help wanted
#   blue          documentation, typescript, area: workers/docs, area: export, dependencies
#   deep blue     area: audio-engine, area: ci, webaudio, test, dsp: metrics
#   purple        privacy, methodology, good first issue, area: experiments, dsp: synthetic,
#                 exp: A–E, dsp: analysis, question
#   pink          accessibility, ui/ux, area: ui, area: visualizations
#   gray          duplicate, invalid, needs-*, wontfix, blocked, breaking-change
#
# See docs/LABELS.md for the full guide: when to apply each label,
# how to combine them, and triage workflow.

# ── GitHub defaults (kept as-is) ─────────────────────────────────────────────
- name: accessibility
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: bug
  color: "d73a4a"
  description: "Something isn't working"
- name: dependencies
  color: "0366d6"
  description: "Pull requests that update a dependency file"
- name: documentation
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: duplicate
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: enhancement
  color: "a2eeef"
  description: "New feature or request"
- name: good first issue
  color: "7057ff"
  description: "Good for newcomers"
- name: help wanted
  color: "008672"
  description: "Extra attention is needed"
- name: invalid
  color: "e4e669"
  description: "This doesn't seem right"
- name: javascript
  color: "168700"
  description: "Pull requests that update javascript code"
- name: question
  color: "d876e3"
  description: "Further information is requested"
- name: wontfix
  color: "ffffff"
  description: "This will not be worked on"

