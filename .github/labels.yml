- name: refactor
  color: "fbca04"
  description: "Code health, decomposition, or complexity reduction"
- name: chore
  color: "c5def5"
  description: "Maintenance, tooling, or housekeeping"
- name: test
  color: "1d76db"
  description: "Tests, fixtures, coverage, or E2E validation"
- name: performance
  color: "ff9f1c"
  description: "Performance, memory, rendering, or FFT speed"
- name: security
  color: "b60205"
  description: "Security, CSP, or privacy-boundary vulnerability"
- name: privacy
  color: "5319e7"
  description: "Consent, data retention, persistence, or export sensitivity"
- name: ui/ux
  color: "e99695"
  description: "Views, layout, styling, or user experience"
- name: breaking-change
  color: "0c0c0c"
