name: Merge Version

# On every pushed semver tag, creates the GitHub release from that tag and merges
# it into the floating major (`v1`) and minor (`v1.0`) branches, creating those
# branches on the first release. Stable tags then request a changelog update.
#
# https://github.com/marketplace/actions/merge-version
#
# Release flow:
#   1. Tag a commit and push it:  git tag v1.2.0 && git push origin v1.2.0
#   2. This workflow creates release `v1.2.0` with generated release notes.
#   3. Branches `v1` and `v1.2` are created or advanced to the tagged commit.
#   4. For stable tags, `Update Changelog` is dispatched to record the release in
#      CHANGELOG.md. (Prerelease tags such as `v1.2.0-rc.1` are marked as
#      prereleases and deliberately left out of the changelog.)

on:
  push:
    tags:
      # Only full semver tags: the action parses the tag with `semver` and fails
      # the run on anything it cannot parse, including short tags like `v1.2`.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# `contents: write` covers the release, the version branches and the merges;
# `actions: write` is needed to dispatch the changelog workflow.
permissions:
  contents: write
  actions: write

concurrency:
  group: merge-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge-version:
    name: Release and advance version branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to the exact release: upstream publishes no floating `v1` tag (its
      # `v1` ref is a mutable branch), so `@v1` would not be immutable. Bump
      # deliberately.
      #
      # Upstream declares the retired `node16` runtime. The runner still accepts
      # that value and maps node12/node16 to node20, which in turn runs on Node 24,
      # so the action executes — expect a deprecation annotation in the run log.
      #
      # Inputs are spelled out rather than inherited, so an upstream default change
      # cannot silently alter what a release does:
      #   release: 'true'  → create the release from the tag
      #   minor:   'true'  → also maintain the `v1.2` branch
      # `pre` is intentionally not passed: upstream's action.yml declares `pre` but
      # its code reads `pre-release`, so the input is inert. Skipping branches for
      # prerelease tags is already the default, which is the behaviour we want;
      # step 2 handles the part the action gets wrong (see below).
      - name: Create release and merge version branches
        uses: caijinglong/action-version-merge@v1.0.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release: 'true'
          minor: 'true'

      # The action creates every release unflagged, so a `-rc.1` tag would otherwise
      # publish as a full release and claim the "latest" slot.
      - name: Flag prerelease tags as prereleases
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --prerelease

      # Releases created with the default GITHUB_TOKEN do not raise a `release`
      # event that can start workflows, so the changelog update is requested
      # explicitly. `workflow_dispatch` is exempt from that restriction, which keeps
      # this chain working without a personal access token.
      #
      # Non-fatal: the release and version branches are the primary result, and a
      # dispatch cannot run until this workflow exists on the default branch.
      - name: Request changelog update
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-changelog.yml --ref "$DEFAULT_BRANCH" -f "tag=$TAG"
