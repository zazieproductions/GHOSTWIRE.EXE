name: Validate

# Core validation gate: type-check, lint, test, build, and dependency audit.
# Runs on every push to main and on every PR. Failures block merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check · Lint · Test · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc -b)
        run: npx tsc -b --noEmit

      - name: Lint (project type-check)
        run: npm run lint

      - name: Complexity guard
        run: npm run check:complexity

      - name: Tests (vitest)
        run: npm test

      - name: Build (tsc -b + Vite, includes complexity guard)
        run: npm run build

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
