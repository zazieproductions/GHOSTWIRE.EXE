name: Labeler

# Automatically labels pull requests based on changed file paths, using the
# rules in .github/labeler.yml. Labels are advisory triage aids only; they do
# not gate merges.
#
# Uses `pull_request_target` so fork PRs can be labeled (the default
# `pull_request` token is read-only for forks). This workflow is safe under
# `pull_request_target` because it never checks out or executes PR code —
# actions/labeler reads the config from the base branch via the API.
#
# Note: the first PR that introduces this workflow will not be labeled,
# because `pull_request_target` runs from the base branch. Labeling starts
# with the next PR after this merges.
#
# https://github.com/marketplace/actions/labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          # All labels in .github/labeler.yml already exist in the repo, so
          # no `issues: write` permission is needed to create them.
          # `sync-labels` stays at its default (false) so manually applied
          # labels are never removed by this workflow.
          configuration-path: '.github/labeler.yml'
